name: Build ChessLens Realtime v0.5 - Smart Board Recognition

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ChessLens-Realtime-v0.5-Smart-Board*.zip'
      - '.github/workflows/build-android-v0.5*.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack v0.5 source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="ChessLens-Realtime-v0.5-Smart-Board.zip"
          if [[ ! -s "$archive" ]]; then
            archive="$(find . -maxdepth 1 -type f -name 'ChessLens-Realtime-v0.5-Smart-Board*.zip' -print -quit)"
          fi
          test -n "$archive"
          test -s "$archive"
          unzip -oq "$archive" -d .
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/java/id/chesslens/realtime/vision/BoardFinder.java
          test -f app/src/main/java/id/chesslens/realtime/vision/PositionTracker.java
          test -f app/src/main/java/id/chesslens/realtime/ScreenService.java
          test -f app/src/main/java/id/chesslens/realtime/overlay/FloatingOverlay.java
          grep -q 'versionName .0.5.0.' app/build.gradle
          grep -q 'detectOrientation' app/src/main/java/id/chesslens/realtime/vision/PositionTracker.java
          grep -q 'looksLikeStartingPosition' app/src/main/java/id/chesslens/realtime/vision/PositionTracker.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download pinned Stockfish 18 WASM assets from npm registry
        shell: bash
        run: |
          set -euo pipefail
          cache="$HOME/.cache/chesslens-stockfish-18.0.5"
          mkdir -p "$cache" "$RUNNER_TEMP/stockfish-package"
          js="$cache/stockfish-18-single.js"
          wasm="$cache/stockfish-18-single.wasm"
          if [[ ! -s "$js" || $(stat -c%s "$js") -lt 10000 || ! -s "$wasm" || $(stat -c%s "$wasm") -lt 100000000 ]]; then
            pack_name="$(npm pack stockfish@18.0.5 --silent --pack-destination "$RUNNER_TEMP/stockfish-package")"
            test -n "$pack_name"
            tar -xzf "$RUNNER_TEMP/stockfish-package/$pack_name" -C "$RUNNER_TEMP/stockfish-package"
            cp "$RUNNER_TEMP/stockfish-package/package/bin/stockfish-18-single.js" "$js"
            cp "$RUNNER_TEMP/stockfish-package/package/bin/stockfish-18-single.wasm" "$wasm"
          fi
          test "$(stat -c%s "$js")" -gt 10000
          test "$(stat -c%s "$wasm")" -gt 100000000
          js_sha="$(sha256sum "$js" | awk '{print $1}')"
          wasm_sha="$(sha256sum "$wasm" | awk '{print $1}')"

          engine_java="app/src/main/java/id/chesslens/realtime/engine/EngineInstaller.java"
          host_java="app/src/main/java/id/chesslens/realtime/engine/WasmEngineHost.java"
          sed -i 's#https://cdn.jsdelivr.net/npm/stockfish@18.0.5/bin/#https://unpkg.com/stockfish@18.0.5/bin/#g' "$engine_java"
          sed -i 's/stockfish\.wasm/stockfish-18-single.wasm/g' "$engine_java"
          sed -i 's#/engine/stockfish\.wasm#/engine/stockfish-18-single.wasm#g' "$host_java"
          sed -i "s/__STOCKFISH_JS_SHA256__/$js_sha/g" "$engine_java"
          sed -i "s/__STOCKFISH_WASM_SHA256__/$wasm_sha/g" "$engine_java"
          ! grep -q '__STOCKFISH_.*_SHA256__' "$engine_java"
          grep -q 'https://unpkg.com/stockfish@18.0.5/bin/stockfish-18-single.js' "$engine_java"
          grep -q 'stockfish-18-single.wasm' "$engine_java"
          grep -q '/engine/stockfish-18-single.wasm' "$host_java"
          echo "Stockfish JS SHA-256: $js_sha"
          echo "Stockfish WASM SHA-256: $wasm_sha"
          echo "Stockfish WASM bytes: $(stat -c%s "$wasm")"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and confirm Stockfish remains on-demand
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          if unzip -Z1 "$apk" | grep -Eiq 'stockfish.*\.(wasm|js)$|libstockfish'; then
            echo "Stockfish must download inside the app, not be bundled in the installer APK."
            exit 1
          fi
          cp "$apk" ChessLens-Realtime-v0.5-debug.apk
          echo "APK size: $(du -h "$apk" | cut -f1)"
          "${ANDROID_HOME}/build-tools/34.0.0/aapt" dump badging "$apk" | grep -E "versionName='0.5.0'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessLens-Realtime-v0.5-APK
          path: ChessLens-Realtime-v0.5-debug.apk
          retention-days: 30
