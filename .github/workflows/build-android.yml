name: Build ChessLens APK (Stockfish 18)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack full project archive when uploaded
        shell: bash
        run: |
          set -euo pipefail
          archive="ChessLens-Realtime-Full-Project-Fixed-v2.zip"
          if [[ -f "$archive" ]]; then
            unzip -oq "$archive" -d .
          fi
          test -f settings.gradle
          test -f build.gradle
          test -d app/src/main
          test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$sdkmanager_path"
          # Avoid pipefail treating the expected SIGPIPE from `yes` as a failure.
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Obtain official Stockfish 18 Android executables
        shell: bash
        run: |
          set -euo pipefail
          while IFS=' ' read -r suffix abi expected; do
            test -n "$suffix" || continue
            archive="stockfish-android-${suffix}.tar"
            url="https://github.com/official-stockfish/Stockfish/releases/download/sf_18/${archive}"
            echo "Fetching ${url}"
            curl --fail --location --retry 4 --retry-delay 3 --output "$archive" "$url"
            mkdir -p "stockfish-extract/${suffix}"
            tar -xf "$archive" -C "stockfish-extract/${suffix}"
            binary="$(find "stockfish-extract/${suffix}" -type f -name "stockfish-android-${suffix}" -print -quit)"
            test -s "$binary" || { echo "Engine executable missing for ${suffix}"; exit 1; }
            echo "${expected}  ${binary}" | sha256sum --check --status
            mkdir -p "app/src/main/jniLibs/${abi}"
            cp "$binary" "app/src/main/jniLibs/${abi}/libstockfish.so"
          done <<'ENGINES'
          armv8 arm64-v8a cc3b3b74466b6d85cdc0f8cfdad4111c6a44bd0698f4eab96fea7b359a54d3d4
          armv7-neon armeabi-v7a 672fbd7533d15fc70dae82df52c1185236975d059a585aa65eda960f1a3266ea
          ENGINES

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and packaged engines
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libstockfish\.so$'
          unzip -Z1 "$apk" | grep -q '^lib/armeabi-v7a/libstockfish\.so$'
          cp "$apk" ChessLens-Realtime-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessLens-Realtime-APK
          path: ChessLens-Realtime-debug.apk
          retention-days: 30

      - name: Publish APK release on manual build
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="chesslens-v0.2-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" ChessLens-Realtime-debug.apk \
            --title "ChessLens Realtime APK — build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK for personal testing. Android 8+, arm64 and armeabi-v7a. Not yet validated on a physical device. Stockfish 18 is GPLv3."
