plugins { id 'com.android.application' }
android {
  namespace 'id.chesslens.realtime'
  compileSdk 34
  defaultConfig { applicationId 'id.chesslens.realtime'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.2.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols.add("**/libstockfish.so") } }
}
dependencies { implementation 'com.github.bhlangonijr:chesslib:1.3.7' }
